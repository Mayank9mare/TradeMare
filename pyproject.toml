[project]
name = "trademare"
version = "0.1.0"
description = "Swing-trading signal engine for Indian and US equities with fundamental, technical and sentiment analysis"
requires-python = ">=3.12"
dependencies = [
    "exchange-calendars>=4.13.2",
    "fastapi>=0.143.1",
    "jinja2>=3.1.6",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
    "yfinance>=1.7.0",
]

[project.scripts]
trademare = "trademare.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
