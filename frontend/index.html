<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TradeMare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <script>
      // Same theme and density as the classic dashboard (shared localStorage keys), set before paint.
      try {
        const t = localStorage.getItem("tm-theme"); if (t && t !== "auto") document.documentElement.dataset.theme = t;
        if (localStorage.getItem("tm-density") === "compact") document.documentElement.dataset.density = "compact";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
