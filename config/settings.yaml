# TradeMare settings. Every value here can be changed without touching code.
# Personal overrides (real budgets, your email) go in config/settings.local.yaml,
# which is git-ignored and deep-merged over this file.
# Secrets (API keys, SMTP password) go in .env — see .env.example.

database_url: sqlite:///data/trademare.db
log_level: INFO

data:
  cache_dir: data/cache
  history_years: 18            # daily bars kept: 2008+ (v3 holdout 2010-2019 needs warm-up)
  fundamentals_refresh_days: 7
  batch_size: 50               # symbols per bulk price request

markets:
  IN:
    enabled: true
    validated: false           # strategy v2 failed its out-of-sample bar: paper trading only
    broker: paper              # zerodha | dhan | groww | paper
    universe: nifty500
    universe_top_n: 200        # each day, only the 200 most-traded names (reduces survivorship bias)
    strategy_mode: factor      # v2 paper candidate — see docs/research/2026-10-17-strategy-v2-plan.md
    daily_run_time: "17:00"    # IST, daily job (data update, paper fills, signals, email) on trading days
    factors: [mom_12_1, earnings_yield]
    price_source: yfinance
    fundamentals_source: yfinance  # filing dates estimated from SEBI reporting deadlines
    benchmark: "^NSEI"             # Nifty 50: relative strength + market regime
    min_avg_traded_value: 100000000  # ₹10 Cr/day average turnover
    slippage_bps: 5                # assumed adverse slippage on market/stop fills
    budget: 100000             # INR — hard cap on deployed capital
    cash_buffer_pct: 10

    allow_long: true
    allow_short: false         # India swing shorts need short_instrument: futures
    short_instrument: cash     # cash | futures

    risk_per_trade_pct: 1.0    # % of budget risked between entry and stop
    max_position_pct: 15       # max % of budget in one position
    max_open_positions: 10
    max_sector_pct: 30

    stop_loss:
      method: atr              # atr | percent | swing_low | fixed_amount
      atr_multiple: 3.0        # wide protective stop for monthly momentum holdings
      atr_period: 14
      percent: 5.0             # used when method: percent
      fixed_amount: null       # per-share distance, used when method: fixed_amount
      swing_lookback: 10       # used when method: swing_low
      trailing: false
      trail_method: atr        # atr | percent
      trail_value: 2.5
      limit_buffer_pct: 1.0    # Zerodha/Dhan stops are limit orders this far past the trigger; bigger gaps exit at next open

    take_profit:
      method: none             # r_multiple | percent | none — momentum lets winners run

    time_stop_days: null       # exit if no progress after N sessions (null = off)
    signal_expiry_sessions: 1  # unapproved signals expire after N sessions

    kill_switch:
      daily_loss_pct: 3
      max_drawdown_pct: 10

    tax:                       # hint on exit signals when a gain turns long-term soon (info only)
      warn_within_days: 60
      short_term_rate_pct: 20  # listed equity STCG (Finance Act 2024)
      long_term_rate_pct: 12.5 # LTCG, above the yearly ₹1.25 lakh exemption

    pretrade:                  # last checks before a live order (paper: logged as warnings only)
      price_band_pct: 5        # a buy's limit must be within 5% of the last close
      max_orders_per_day: 10   # new buy orders per day
      check_funds: true        # refuse a buy the Zerodha account cannot pay for
      check_surveillance: true # no new buys in stocks on NSE's ASM/GSM lists

  US:
    enabled: true
    validated: false           # no factor passed selection (v2); swing v1 has no edge: signals only
    broker: paper              # alpaca | paper
    universe: sp500
    price_source: yfinance
    fundamentals_source: edgar     # point-in-time via SEC filing dates; needs SEC_USER_AGENT in .env
    benchmark: "^GSPC"             # S&P 500 index
    daily_run_time: "17:30"        # New York time
    min_avg_traded_value: 20000000   # $20M/day average dollar volume
    slippage_bps: 5
    budget: 1000               # USD
    cash_buffer_pct: 10

    allow_long: true
    allow_short: false         # needs an Alpaca margin account (>= $2,000 equity)

    risk_per_trade_pct: 1.0
    max_position_pct: 15
    max_open_positions: 8
    max_sector_pct: 30

    stop_loss:
      method: atr
      atr_multiple: 2.0
      trailing: true
      trail_method: atr
      trail_value: 2.5

    take_profit:
      method: r_multiple
      value: 2.0

    time_stop_days: 15
    signal_expiry_sessions: 1

    kill_switch:
      daily_loss_pct: 3
      max_drawdown_pct: 10

    tax:                       # federal rates depend on your bracket: set both to see a $ estimate
      warn_within_days: 60
      short_term_rate_pct: null
      long_term_rate_pct: null

strategy:
  weights:
    fundamental: 0.35
    technical: 0.50
    sentiment: 0.15            # ignored while llm.enabled is false
  min_composite_score: 0.4     # |weighted score| needed for a long/short idea
  min_fundamental_score: 0.0   # longs need fundamental >= this, shorts <= -this
  require_fundamentals: true   # skip symbols with no fundamental data
  regime_penalty: 0.15         # extra score needed to trade against the market regime
  max_ideas: 10                # per direction, per market
  avoid_extended_entries: true # don't chase overextended moves
  exit_score: 0.0              # exit a long when its composite falls to this (shorts: rises to -this)
  fundamentals_refresh_days: 7 # recompute fundamental scores weekly
  # Factor mode (markets with strategy_mode: factor)
  factor_rebalance: monthly    # daily | weekly | monthly
  factor_entry_pct: 0.10       # buy names ranked in the top 10%
  factor_exit_pct: 0.30        # sell names that fall out of the top 30%
  risk_off_exposure: 0.5       # in risk-off regimes allow only half of max_open_positions
  # Strategy v3 risk controls — see docs/research/2026-10-18-strategy-v3-plan.md
  vol_target: true             # fewer slots when the index is more volatile than usual (63d vs 3y median)
  exclude_high_vol_pct: 0.2    # no new entries in the most volatile 20% of stocks

ops:                           # backups and the missed-run alarm
  backup_enabled: true
  backup_dir: data/backups     # one SQLite copy per day
  backup_keep: 14              # days of backups kept
  backup_time: "23:30"         # local time of the nightly backup
  health_check: true           # alert (Telegram + email) when a daily run is overdue or backups are stale
  health_grace_hours: 3        # a run counts as missed this long after daily_run_time
  intraday_check_minutes: 15   # in market hours: alert when a holding trades through its stop, and exit
                               # live positions whose stop is stuck past its limit (0 = off)
  ipo_alerts: true             # India: alert when a mainboard IPO opens within 2 days, and at 2:30 pm on its
                               # last bidding day with the demand so far (never applies for you)

backtest:
  years: 5                     # default length, ending at the latest cached session
  out_of_sample_fraction: 0.4  # last 40% reported separately (never used for tuning)
  compound: true               # size positions from current equity
  short_borrow_rate_pct: 0.5   # annual borrow fee on shorts

notifications:
  email:
    enabled: false
    to: []                     # set in settings.local.yaml
    send_empty_digest: false
  telegram:                    # phone alerts; bot token in .env (TELEGRAM_BOT_TOKEN)
    enabled: false
    chat_id: null              # set in settings.local.yaml (trademare notify telegram-setup finds it)
    send_empty: false          # message only when there are signals or alerts
  dashboard_url: http://127.0.0.1:8000   # for links in emails and messages

llm:                           # optional news-sentiment overlay: vetoes entries with red-flag news
  enabled: false
  provider: anthropic          # anthropic (ANTHROPIC_API_KEY) | openai (OPENAI_API_KEY + prices below)
  model: claude-opus-5-5
  max_daily_cost_usd: 1.0      # hard daily cap; further stocks are skipped (not vetoed) once reached
  lookback_days: 7             # headline window (Google News)
  max_headlines: 15
  veto_score: -0.5             # veto longs at or below this sentiment score, or on any red flag
